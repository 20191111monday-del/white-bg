<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBB 純白背景メーカー</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f2f5; color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 450px; margin: 0 auto; }
    h1 { font-size: 1.2em; margin-bottom: 15px; color: #004080; }
    .btn { display: block; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; box-sizing: border-box; }
    .btn-select { background: #004080; color: white; }
    .btn-save { background: #27ae60; color: white; text-decoration: none; display: none; }
    .controls { margin-top: 15px; text-align: left; font-size: 0.85em; color: #555; background: #f9f9f9; padding: 10px; border-radius: 6px; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
    #preview-area { margin-top: 20px; display: none; }
    #result-img { width: 100%; max-height: 350px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
    #status { margin-top: 15px; font-weight: bold; color: #d35400; font-size: 0.95em; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBB 純白背景メーカー</h1>
    <p style="font-size: 0.85em; color: #666;">写真を選ぶと外側の背景だけを純白にします</p>
    
    <label class="btn btn-select" id="select-label">
      📷 写真を選択して白抜き
      <input type="file" id="file-input" accept="image/*">
    </label>

    <div class="controls" id="controls" style="display:none;">
      <div class="slider-row">
        <span>背景検出の感度（許容差）:</span>
        <input type="range" id="tolerance" min="10" max="80" value="35" oninput="applyFloodFill()">
      </div>
    </div>

    <div id="status"></div>

    <div id="preview-area">
      <img id="result-img" src="" alt="処理結果">
      <a id="save-btn" class="btn btn-save" download="white-bg.jpg">💾 白抜き画像を保存</a>
    </div>
  </div>

  <script>
    let currentImage = null;

    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const previewArea = document.getElementById('preview-area');
      const saveBtn = document.getElementById('save-btn');
      const controls = document.getElementById('controls');

      status.innerText = '🔄 処理中...';
      previewArea.style.display = 'none';
      saveBtn.style.display = 'none';

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          currentImage = img;
          controls.style.display = 'block';
          applyFloodFill();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function applyFloodFill() {
      if (!currentImage) return;

      const tolerance = parseInt(document.getElementById('tolerance').value, 10);
      const canvas = document.createElement('canvas');
      let maxDim = 1000;
      let width = currentImage.width;
      let height = currentImage.height;

      if (width > height) {
        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
      } else {
        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
      }

      width = Math.floor(width);
      height = Math.floor(height);
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(currentImage, 0, 0, width, height);

      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      const visited = new Uint8Array(width * height);

      // 四隅の色を基準色としてサンプリング
      const bgR = data[0], bgG = data[1], bgB = data[2];

      function colorMatch(idx) {
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        return Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB) < tolerance * 3;
      }

      // 外周（エッジ）から塗りつぶしを開始するキュー
      const queue = [];
      for (let x = 0; x < width; x++) {
        queue.push(x, 0);
        queue.push(x, height - 1);
      }
      for (let y = 0; y < height; y++) {
        queue.push(0, y);
        queue.push(width - 1, y);
      }

      while (queue.length > 0) {
        const y = queue.pop();
        const x = queue.pop();
        const pIdx = y * width + x;

        if (visited[pIdx]) continue;
        visited[pIdx] = 1;

        const dIdx = pIdx * 4;
        if (colorMatch(dIdx)) {
          // 純白に置換
          data[dIdx] = 255;
          data[dIdx+1] = 255;
          data[dIdx+2] = 255;

          // 4方向へ探索
          if (x > 0 && !visited[pIdx - 1]) queue.push(x - 1, y);
          if (x < width - 1 && !visited[pIdx + 1]) queue.push(x + 1, y);
          if (y > 0 && !visited[pIdx - width]) queue.push(x, y - 1);
          if (y < height - 1 && !visited[pIdx + width]) queue.push(x, y + 1);
        }
      }

      ctx.putImageData(imgData, 0, 0);

      const finalUrl = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('result-img').src = finalUrl;
      const saveBtn = document.getElementById('save-btn');
      saveBtn.href = finalUrl;

      document.getElementById('status').innerText = '✅ 外側背景の白抜き完了！感度スライダーで調整できます';
      document.getElementById('preview-area').style.display = 'block';
      saveBtn.style.display = 'block';
    }
  </script>
</body>
</html>
