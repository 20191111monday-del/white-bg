<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBB 純白背景メーカー</title>
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.3/dist/imgly-background-removal.browser.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f2f5; color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 450px; margin: 0 auto; }
    h1 { font-size: 1.2em; margin-bottom: 15px; color: #004080; }
    .btn { display: block; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; box-sizing: border-box; }
    .btn-select { background: #004080; color: white; }
    .btn-save { background: #27ae60; color: white; text-decoration: none; display: none; }
    #preview-area { margin-top: 20px; display: none; }
    #result-img { width: 100%; max-height: 350px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
    #status { margin-top: 15px; font-weight: bold; color: #d35400; font-size: 0.95em; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBB 純白背景メーカー</h1>
    <p style="font-size: 0.85em; color: #666;">写真を選ぶとAIが自動で背景を純白にします</p>
    
    <label class="btn btn-select" id="select-label">
      📷 写真を選択して白抜き
      <input type="file" id="file-input" accept="image/*" onchange="processImage(this.files[0])">
    </label>

    <div id="status"></div>

    <div id="preview-area">
      <img id="result-img" src="" alt="処理結果">
      <a id="save-btn" class="btn btn-save" download="white-background.jpg">💾 白抜き画像を保存</a>
    </div>
  </div>

  <script>
    async function processImage(file) {
      if (!file) return;

      const status = document.getElementById('status');
      const label = document.getElementById('select-label');
      const previewArea = document.getElementById('preview-area');
      const resultImg = document.getElementById('result-img');
      const saveBtn = document.getElementById('save-btn');

      previewArea.style.display = 'none';
      saveBtn.style.display = 'none';
      label.style.pointerEvents = 'none';
      label.style.opacity = '0.6';
      status.innerText = '🤖 AIが背景を切り抜いています... (初回は数秒待機)';

      try {
        // 1. AIで背景を透明化
        const imageBlob = await imglyRemoveBackground(file);
        const url = URL.createObjectURL(imageBlob);

        // 2. キャンバス上で純白(RGB: 255,255,255)と合成し、1200pxにリサイズ
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let maxDim = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');

          // 純白で塗りつぶし
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          // JPEG出力
          const finalUrl = canvas.toDataURL('image/jpeg', 0.85);
          resultImg.src = finalUrl;
          saveBtn.href = finalUrl;

          status.innerText = '✅ 白抜き完了！長押しまたはボタンで保存できます';
          previewArea.style.display = 'block';
          saveBtn.style.display = 'block';
          label.style.pointerEvents = 'auto';
          label.style.opacity = '1';
          URL.revokeObjectURL(url);
        };
        img.src = url;
      } catch (err) {
        status.innerText = '❌ エラーが発生しました。通信環境の良い場所でお試しください。';
        label.style.pointerEvents = 'auto';
        label.style.opacity = '1';
        console.error(err);
      }
    }
  </script>
</body>
</html>
