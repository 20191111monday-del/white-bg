<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBB 純白背景メーカー</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f0f2f5; color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.2em; margin-bottom: 15px; color: #004080; }
    .btn { display: block; width: 100%; padding: 14px; font-size: 1.05em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; box-sizing: border-box; }
    .btn-select { background: #004080; color: white; }
    .btn-save { background: #27ae60; color: white; text-decoration: none; display: none; }
    .controls { margin-top: 15px; text-align: left; font-size: 0.85em; color: #444; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #e9ecef; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row span { font-weight: bold; }
    .slider-row input { width: 55%; }
    #preview-area { margin-top: 20px; display: none; }
    #result-img { width: 100%; max-height: 380px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
    #status { margin-top: 15px; font-weight: bold; color: #d35400; font-size: 0.9em; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBB 純白背景メーカー</h1>
    <p style="font-size: 0.85em; color: #666;">写真を選ぶと影を残さず背景を純白に変換します</p>
    
    <label class="btn btn-select" id="select-label">
      📷 写真を選択して白抜き
      <input type="file" id="file-input" accept="image/*">
    </label>

    <div class="controls" id="controls" style="display:none;">
      <div class="slider-row">
        <span>影の除去強度:</span>
        <input type="range" id="tolerance" min="15" max="90" value="45" oninput="processWhiteout()">
      </div>
      <div class="slider-row">
        <span>本の輪郭ガード:</span>
        <input type="range" id="edgeGuard" min="10" max="60" value="30" oninput="processWhiteout()">
      </div>
    </div>

    <div id="status"></div>

    <div id="preview-area">
      <img id="result-img" src="" alt="処理結果">
      <a id="save-btn" class="btn btn-save" download="white-bg.jpg">💾 白抜き画像を保存</a>
    </div>
  </div>

  <script>
    let currentImage = null;

    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const previewArea = document.getElementById('preview-area');
      const saveBtn = document.getElementById('save-btn');
      const controls = document.getElementById('controls');

      status.innerText = '🔄 処理中...';
      previewArea.style.display = 'none';
      saveBtn.style.display = 'none';

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          currentImage = img;
          controls.style.display = 'block';
          processWhiteout();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function processWhiteout() {
      if (!currentImage) return;

      const tol = parseInt(document.getElementById('tolerance').value, 10);
      const edgeGuard = parseInt(document.getElementById('edgeGuard').value, 10);

      const canvas = document.createElement('canvas');
      let maxDim = 1000;
      let width = currentImage.width;
      let height = currentImage.height;

      if (width > height) {
        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
      } else {
        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
      }

      width = Math.floor(width);
      height = Math.floor(height);
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(currentImage, 0, 0, width, height);

      const srcImgData = ctx.getImageData(0, 0, width, height);
      const src = srcImgData.data;
      const outImgData = ctx.createImageData(width, height);
      const out = outImgData.data;

      // 元画像をコピー
      for (let i = 0; i < src.length; i++) {
        out[i] = src[i];
      }

      // 1. エッジ（輪郭境界）マップの作成（本の境界線を検出）
      const isEdge = new Uint8Array(width * height);
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const idx = (y * width + x) * 4;
          const r = src[idx], g = src[idx+1], b = src[idx+2];

          const rightIdx = (y * width + (x + 1)) * 4;
          const downIdx = ((y + 1) * width + x) * 4;

          const diffR = Math.abs(r - src[rightIdx]) + Math.abs(r - src[downIdx]);
          const diffG = Math.abs(g - src[rightIdx+1]) + Math.abs(g - src[downIdx+1]);
          const diffB = Math.abs(b - src[rightIdx+2]) + Math.abs(b - src[downIdx+2]);

          if ((diffR + diffG + diffB) > edgeGuard * 4) {
            isEdge[y * width + x] = 1;
          }
        }
      }

      // 2. 外周からの適応型 Flood Fill
      const visited = new Uint8Array(width * height);
      const queue = [];

      // 四隅・外周ピクセルをキューに投入
      for (let x = 0; x < width; x++) {
        queue.push(x, 0, src[x * 4], src[x * 4 + 1], src[x * 4 + 2]);
        const bIdx = ((height - 1) * width + x) * 4;
        queue.push(x, height - 1, src[bIdx], src[bIdx + 1], src[bIdx + 2]);
      }
      for (let y = 0; y < height; y++) {
        const lIdx = (y * width) * 4;
        queue.push(0, y, src[lIdx], src[lIdx + 1], src[lIdx + 2]);
        const rIdx = (y * width + (width - 1)) * 4;
        queue.push(width - 1, y, src[rIdx], src[rIdx + 1], src[rIdx + 2]);
      }

      while (queue.length > 0) {
        const refB = queue.pop();
        const refG = queue.pop();
        const refR = queue.pop();
        const y = queue.pop();
        const x = queue.pop();
        const pIdx = y * width + x;

        if (visited[pIdx]) continue;
        visited[pIdx] = 1;

        const dIdx = pIdx * 4;
        const curR = src[dIdx];
        const curG = src[dIdx+1];
        const curB = src[dIdx+2];

        // 直前の色との差分判定（なだらかな影も追従）
        const colorDiff = Math.abs(curR - refR) + Math.abs(curG - refG) + Math.abs(curB - refB);

        // エッジに衝突しておらず、色の変化が許容範囲内なら背景として白化
        if (!isEdge[pIdx] && colorDiff < tol * 3) {
          out[dIdx] = 255;
          out[dIdx+1] = 255;
          out[dIdx+2] = 255;

          // 4近傍探索（隣接ピクセルへ伝播）
          if (x > 0 && !visited[pIdx - 1]) queue.push(x - 1, y, curR, curG, curB);
          if (x < width - 1 && !visited[pIdx + 1]) queue.push(x + 1, y, curR, curG, curB);
          if (y > 0 && !visited[pIdx - width]) queue.push(x, y - 1, curR, curG, curB);
          if (y < height - 1 && !visited[pIdx + width]) queue.push(x, y + 1, curR, curG, curB);
        }
      }

      ctx.putImageData(outImgData, 0, 0);

      const finalUrl = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('result-img').src = finalUrl;
      const saveBtn = document.getElementById('save-btn');
      saveBtn.href = finalUrl;

      document.getElementById('status').innerText = '✅ 処理完了！2つのスライダーで仕上がりを微調整できます';
      document.getElementById('preview-area').style.display = 'block';
      saveBtn.style.display = 'block';
    }
  </script>
</body>
</html>
