<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBB 純白背景メーカー</title>
  <style>
    body { font-family: sans-serif; padding: 12px; background: #f0f2f5; color: #333; text-align: center; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.15em; margin-bottom: 10px; color: #004080; }
    .btn { display: block; width: 100%; padding: 14px; font-size: 1.05em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; box-sizing: border-box; }
    .btn-select { background: #004080; color: white; }
    .btn-save { background: #27ae60; color: white; text-decoration: none; display: none; }
    .controls { margin-top: 12px; text-align: left; font-size: 0.85em; color: #333; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #e9ecef; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row span { font-weight: bold; width: 35%; }
    .slider-row input { width: 60%; }
    .section-label { font-weight: bold; color: #004080; margin-top: 8px; margin-bottom: 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
    #preview-area { margin-top: 15px; display: none; }
    #result-img { width: 100%; max-height: 360px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
    #status { margin-top: 10px; font-weight: bold; color: #d35400; font-size: 0.85em; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBB 純白背景メーカー</h1>
    
    <label class="btn btn-select" id="select-label">
      📷 写真を選択して白抜き
      <input type="file" id="file-input" accept="image/*">
    </label>

    <div class="controls" id="controls" style="display:none;">
      <div class="slider-row">
        <span>🤖 自動検出感度:</span>
        <input type="range" id="sensitivity" min="5" max="100" value="40" oninput="detectBounds(); runCrop();">
      </div>
      
      <div class="section-label">📐 4辺の個別キワ追い込み（強力版）</div>
      <div class="slider-row">
        <span>上辺 (Top):</span>
        <input type="range" id="padTop" min="-150" max="150" value="0" oninput="runCrop()">
      </div>
      <div class="slider-row">
        <span>下辺 (Bottom):</span>
        <input type="range" id="padBottom" min="-150" max="150" value="0" oninput="runCrop()">
      </div>
      <div class="slider-row">
        <span>左辺 (Left):</span>
        <input type="range" id="padLeft" min="-150" max="150" value="0" oninput="runCrop()">
      </div>
      <div class="slider-row">
        <span>右辺 (Right):</span>
        <input type="range" id="padRight" min="-150" max="150" value="0" oninput="runCrop()">
      </div>
    </div>

    <div id="status"></div>

    <div id="preview-area">
      <img id="result-img" src="" alt="処理結果">
      <a id="save-btn" class="btn btn-save">💾 純白画像を保存</a>
    </div>
  </div>

  <script>
    let rawImage = null;
    let baseBounds = { top: 0, bottom: 0, left: 0, right: 0, width: 0, height: 0 };
    let originalBaseName = "image";

    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      // 既存ファイル名から拡張子を除いたベース名を取得
      const lastDotIndex = file.name.lastIndexOf('.');
      originalBaseName = lastDotIndex !== -1 ? file.name.substring(0, lastDotIndex) : file.name;

      const status = document.getElementById('status');
      const previewArea = document.getElementById('preview-area');
      const saveBtn = document.getElementById('save-btn');
      const controls = document.getElementById('controls');

      status.innerText = '🔄 解析中...';
      previewArea.style.display = 'none';
      saveBtn.style.display = 'none';

      document.getElementById('padTop').value = 0;
      document.getElementById('padBottom').value = 0;
      document.getElementById('padLeft').value = 0;
      document.getElementById('padRight').value = 0;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          rawImage = img;
          controls.style.display = 'block';
          detectBounds();
          runCrop();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function detectBounds() {
      if (!rawImage) return;

      const sensitivity = parseInt(document.getElementById('sensitivity').value, 10);
      let maxDim = 1200;
      let width = rawImage.width;
      let height = rawImage.height;

      if (width > height) {
        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
      } else {
        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
      }

      width = Math.floor(width);
      height = Math.floor(height);

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(rawImage, 0, 0, width, height);

      const imgData = ctx.getImageData(0, 0, width, height);
      const d = imgData.data;

      const cornerIdxs = [0, (width - 1) * 4, ((height - 1) * width) * 4, ((height - 1) * width + (width - 1)) * 4];
      let bgR = 0, bgG = 0, bgB = 0;
      cornerIdxs.forEach(idx => {
        bgR += d[idx]; bgG += d[idx+1]; bgB += d[idx+2];
      });
      bgR /= 4; bgG /= 4; bgB /= 4;

      let top = height, bottom = 0, left = width, right = 0;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const diff = Math.abs(d[idx] - bgR) + Math.abs(d[idx+1] - bgG) + Math.abs(d[idx+2] - bgB);
          if (diff > sensitivity * 3) {
            if (x < left) left = x;
            if (x > right) right = x;
            if (y < top) top = y;
            if (y > bottom) bottom = y;
          }
        }
      }

      baseBounds = { top, bottom, left, right, width, height, canvas };
    }

    function runCrop() {
      if (!rawImage || !baseBounds.canvas) return;

      const pTop = parseInt(document.getElementById('padTop').value, 10);
      const pBottom = parseInt(document.getElementById('padBottom').value, 10);
      const pLeft = parseInt(document.getElementById('padLeft').value, 10);
      const pRight = parseInt(document.getElementById('padRight').value, 10);

      const { width, height, canvas } = baseBounds;

      let finalTop = Math.max(0, baseBounds.top + pTop);
      let finalBottom = Math.min(height, baseBounds.bottom + pBottom);
      let finalLeft = Math.max(0, baseBounds.left - pLeft);
      let finalRight = Math.min(width, baseBounds.right + pRight);

      const outCanvas = document.createElement('canvas');
      outCanvas.width = width;
      outCanvas.height = height;
      const outCtx = outCanvas.getContext('2d');

      outCtx.fillStyle = '#FFFFFF';
      outCtx.fillRect(0, 0, width, height);

      const cropW = finalRight - finalLeft;
      const cropH = finalBottom - finalTop;

      if (cropW > 0 && cropH > 0) {
        outCtx.drawImage(
          canvas,
          finalLeft, finalTop, cropW, cropH,
          finalLeft, finalTop, cropW, cropH
        );
      }

      const finalUrl = outCanvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('result-img').src = finalUrl;
      
      // ユニーク番号（タイムスタンプ）を付与したファイル名
      const uniqueId = Date.now().toString().slice(-6);
      const downloadName = `${originalBaseName}_white_${uniqueId}.jpg`;

      const saveBtn = document.getElementById('save-btn');
      saveBtn.href = finalUrl;
      saveBtn.download = downloadName;

      document.getElementById('status').innerText = '✅ 完了！スライダーで輪郭のキワまで追い込めます';
      document.getElementById('preview-area').style.display = 'block';
      saveBtn.style.display = 'block';
    }
  </script>
</body>
</html>
