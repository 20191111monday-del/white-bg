<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBB 純白背景メーカー</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f0f2f5; color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.2em; margin-bottom: 15px; color: #004080; }
    .btn { display: block; width: 100%; padding: 14px; font-size: 1.05em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; box-sizing: border-box; }
    .btn-select { background: #004080; color: white; }
    .btn-save { background: #27ae60; color: white; text-decoration: none; display: none; }
    .controls { margin-top: 15px; text-align: left; font-size: 0.85em; color: #444; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #e9ecef; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row span { font-weight: bold; }
    .slider-row input { width: 55%; }
    #preview-area { margin-top: 20px; display: none; }
    #result-img { width: 100%; max-height: 380px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
    #status { margin-top: 15px; font-weight: bold; color: #d35400; font-size: 0.9em; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBB 純白背景メーカー</h1>
    <p style="font-size: 0.85em; color: #666;">本の外側を完全な純白（RGB 255）で塗りつぶします</p>
    
    <label class="btn btn-select" id="select-label">
      📷 写真を選択して白抜き
      <input type="file" id="file-input" accept="image/*">
    </label>

    <div class="controls" id="controls" style="display:none;">
      <div class="slider-row">
        <span>境界の自動検出感度:</span>
        <input type="range" id="sensitivity" min="10" max="80" value="35" oninput="renderResult()">
      </div>
      <div class="slider-row">
        <span>外枠のマージン微調整:</span>
        <input type="range" id="marginOffset" min="-30" max="30" value="0" oninput="renderResult()">
      </div>
    </div>

    <div id="status"></div>

    <div id="preview-area">
      <img id="result-img" src="" alt="処理結果">
      <a id="save-btn" class="btn btn-save" download="white-bg.jpg">💾 白抜き画像を保存</a>
    </div>
  </div>

  <script>
    let originalImage = null;

    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const previewArea = document.getElementById('preview-area');
      const saveBtn = document.getElementById('save-btn');
      const controls = document.getElementById('controls');

      status.innerText = '🔄 輪郭解析中...';
      previewArea.style.display = 'none';
      saveBtn.style.display = 'none';

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          originalImage = img;
          controls.style.display = 'block';
          renderResult();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function renderResult() {
      if (!originalImage) return;

      const sensitivity = parseInt(document.getElementById('sensitivity').value, 10);
      const marginOffset = parseInt(document.getElementById('marginOffset').value, 10);

      const canvas = document.createElement('canvas');
      let maxDim = 1200;
      let width = originalImage.width;
      let height = originalImage.height;

      if (width > height) {
        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
      } else {
        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
      }

      width = Math.floor(width);
      height = Math.floor(height);
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(originalImage, 0, 0, width, height);

      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // 四隅の色から背景のベースカラーをサンプリング
      const sampleCorners = [
        [0, 0], [width - 1, 0], [0, height - 1], [width - 1, height - 1]
      ];
      let bgR = 0, bgG = 0, bgB = 0;
      sampleCorners.forEach(([cx, cy]) => {
        const idx = (cy * width + cx) * 4;
        bgR += data[idx];
        bgG += data[idx + 1];
        bgB += data[idx + 2];
      });
      bgR /= 4; bgG /= 4; bgB /= 4;

      // 各行・列をスキャンして「被写体（本）」の境界座標（Top, Bottom, Left, Right）を特定
      let top = height, bottom = 0, left = width, right = 0;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const diff = Math.abs(data[idx] - bgR) + Math.abs(data[idx+1] - bgG) + Math.abs(data[idx+2] - bgB);

          // 背景色から一定以上離れたピクセルを「本」と判定
          if (diff > sensitivity * 3) {
            if (x < left) left = x;
            if (x > right) right = x;
            if (y < top) top = y;
            if (y > bottom) bottom = y;
          }
        }
      }

      // マージン調整を反映（本の内側を削らないよう安全側へシフト）
      left = Math.max(0, left - marginOffset);
      right = Math.min(width, right + marginOffset);
      top = Math.max(0, top - marginOffset);
      bottom = Math.min(height, bottom + marginOffset);

      // 出力用キャンバスを純白で初期化
      const outCanvas = document.createElement('canvas');
      outCanvas.width = width;
      outCanvas.height = height;
      const outCtx = outCanvas.getContext('2d');

      outCtx.fillStyle = '#FFFFFF';
      outCtx.fillRect(0, 0, width, height);

      // 検出した「本の領域」だけを元の画像から純白キャンバスへ転写
      const bookW = right - left;
      const bookH = bottom - top;

      if (bookW > 0 && bookH > 0) {
        outCtx.drawImage(
          canvas,
          left, top, bookW, bookH, // 元画像からの切り出し範囲
          left, top, bookW, bookH  // 描画先
        );
      }

      const finalUrl = outCanvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('result-img').src = finalUrl;
      const saveBtn = document.getElementById('save-btn');
      saveBtn.href = finalUrl;

      document.getElementById('status').innerText = '✅ 外側を完全純白化しました！スライダーで枠幅を微調整できます';
      document.getElementById('preview-area').style.display = 'block';
      saveBtn.style.display = 'block';
    }
  </script>
</body>
</html>
