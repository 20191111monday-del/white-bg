<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBB 純白背景メーカー</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f2f5; color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 450px; margin: 0 auto; }
    h1 { font-size: 1.2em; margin-bottom: 15px; color: #004080; }
    .btn { display: block; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; box-sizing: border-box; }
    .btn-select { background: #004080; color: white; }
    .btn-save { background: #27ae60; color: white; text-decoration: none; display: none; }
    #preview-area { margin-top: 20px; display: none; }
    #result-img { width: 100%; max-height: 350px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
    #status { margin-top: 15px; font-weight: bold; color: #d35400; font-size: 0.95em; line-height: 1.4; white-space: pre-wrap; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBB 純白背景メーカー</h1>
    <p style="font-size: 0.85em; color: #666;">写真を選ぶとAIが自動で背景を純白にします</p>
    
    <label class="btn btn-select" id="select-label">
      📷 写真を選択して白抜き
      <input type="file" id="file-input" accept="image/*">
    </label>

    <div id="status"></div>

    <div id="preview-area">
      <img id="result-img" src="" alt="処理結果">
      <a id="save-btn" class="btn btn-save" download="white-bg.jpg">💾 白抜き画像を保存</a>
    </div>
  </div>

  <!-- ES Modules 形式で安全にインポート -->
  <script type="module">
    import removeBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/+esm';

    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');
    const label = document.getElementById('select-label');
    const previewArea = document.getElementById('preview-area');
    const resultImg = document.getElementById('result-img');
    const saveBtn = document.getElementById('save-btn');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      previewArea.style.display = 'none';
      saveBtn.style.display = 'none';
      label.style.pointerEvents = 'none';
      label.style.opacity = '0.6';
      status.innerText = '🤖 AIエンジンを準備中...\n(初回はモデル読込に10〜20秒かかります)';

      try {
        const config = {
          publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.5.7/dist/",
          progress: (key, current, total) => {
            if (total > 0) {
              const pct = Math.round((current / total) * 100);
              status.innerText = `🤖 AI切り抜き中... (${pct}%)`;
            }
          }
        };

        // 1. AIで背景切り抜き
        const imageBlob = await removeBackground(file, config);
        const url = URL.createObjectURL(imageBlob);

        // 2. 純白キャンバス(255, 255, 255)と合成し1200pxにリサイズ
        status.innerText = '🎨 純白背景を合成中...';
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let maxDim = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');

          // 背景をRGB(255, 255, 255)で塗りつぶす
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          // JPEG出力
          const finalUrl = canvas.toDataURL('image/jpeg', 0.85);
          resultImg.src = finalUrl;
          saveBtn.href = finalUrl;

          status.innerText = '✅ 白抜き完了！\n下のボタンか長押しで保存してください';
          previewArea.style.display = 'block';
          saveBtn.style.display = 'block';
          label.style.pointerEvents = 'auto';
          label.style.opacity = '1';
          fileInput.value = '';
          URL.revokeObjectURL(url);
        };
        img.src = url;

      } catch (err) {
        console.error(err);
        status.innerText = '❌ 処理エラー: ' + (err.message || err);
        label.style.pointerEvents = 'auto';
        label.style.opacity = '1';
        fileInput.value = '';
      }
    });
  </script>
</body>
</html>
